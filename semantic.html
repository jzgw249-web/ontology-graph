<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>语义关系图谱 — ontology-graph</title>
  <script src="https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", sans-serif; background: #0d1117; color: #e6edf3; }
    #header { padding: 12px 20px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    #header h1 { font-size: 16px; }
    #stats { font-size: 12px; color: #8b949e; }
    .legend { display: flex; gap: 14px; font-size: 12px; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .line { width: 16px; height: 3px; display: inline-block; border-radius: 2px; }
    .filters { display: flex; gap: 8px; margin-left: auto; }
    .filters button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
    .filters button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    #net { width: 100vw; height: calc(100vh - 50px); }
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #8b949e; }
  </style>
</head>
<body>
  <div id="header">
    <h1>🔗 语义关系图谱</h1>
    <span id="stats">加载中…</span>
    <div class="legend">
      <span><i class="line" style="background:#ef4444"></i>冲突</span>
      <span><i class="line" style="background:#22c55e"></i>合作</span>
      <span><i class="line" style="background:#f59e0b"></i>外交</span>
      <span><i class="line" style="background:#8b5cf6"></i>结构</span>
    </div>
    <div class="filters" id="filters">
      <button data-g="all" class="active">全部</button>
      <button data-g="conflict">冲突</button>
      <button data-g="cooperation">合作</button>
      <button data-g="diplomacy">外交</button>
      <button data-g="structure">结构</button>
    </div>
  </div>
  <div id="net"><div id="loading">正在加载语义关系图…</div></div>

  <script>
    let network, allNodes, allEdges;
    fetch("data/semantic-graph.json").then(r => r.json()).then(data => {
      document.getElementById("loading").remove();
      document.getElementById("stats").textContent =
        `${data.nodes.length} 实体 · ${data.edges.length} 关系（对齐共现图谱 ${data.nodes.filter(n=>n.inGraph).length}）`;

      allNodes = new vis.DataSet(data.nodes.map(n => ({
        id: n.id, label: n.label,
        value: n.value,
        shape: n.inGraph ? "dot" : "diamond",   // 菱形=图谱外新实体
        color: n.inGraph ? "#58a6ff" : "#6e7681",
        font: { color: "#e6edf3", size: 14, face: "Microsoft YaHei" },
      })));
      allEdges = new vis.DataSet(data.edges.map((e, i) => ({
        id: i, from: e.from, to: e.to, label: e.label,
        color: { color: e.color, highlight: e.color },
        width: Math.min(1 + e.weight, 6),
        arrows: "to",
        group: e.group,
        font: { color: e.color, size: 11, strokeWidth: 3, strokeColor: "#0d1117", face: "Microsoft YaHei" },
        title: e.title,
        smooth: { type: "curvedCW", roundness: 0.15 },
      })));

      network = new vis.Network(document.getElementById("net"), { nodes: allNodes, edges: allEdges }, {
        nodes: { scaling: { min: 8, max: 45 }, borderWidth: 0 },
        edges: { selectionWidth: 2 },
        physics: { barnesHut: { gravitationalConstant: -12000, springLength: 160, springConstant: 0.03 }, stabilization: { iterations: 250 } },
        interaction: { hover: true, tooltipDelay: 100, navigationButtons: true },
      });
      network.on("stabilizationIterationsDone", () => network.setOptions({ physics: false }));

      // 关系分组过滤
      document.querySelectorAll("#filters button").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          const g = btn.dataset.g;
          const filtered = g === "all" ? data.edges : data.edges.filter(e => e.group === g);
          allEdges.clear();
          allEdges.add(filtered.map((e, i) => ({
            id: i, from: e.from, to: e.to, label: e.label,
            color: { color: e.color }, width: Math.min(1 + e.weight, 6), arrows: "to",
            font: { color: e.color, size: 11, strokeWidth: 3, strokeColor: "#0d1117", face: "Microsoft YaHei" },
            title: e.title, smooth: { type: "curvedCW", roundness: 0.15 },
          })));
        };
      });
    }).catch(e => { document.getElementById("loading").textContent = "加载失败：" + e.message; });
  </script>
</body>
</html>
